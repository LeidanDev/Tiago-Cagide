# Faz uma consulta leve ao Supabase a cada 3 dias para o projeto gratuito não pausar por inatividade.
# Usa a chave "anon public", que é pública (a mesma do js/config.js). Não apague a tabela public.photos.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ao banco
        env:
          SUPABASE_URL: https://nkeqmyuywsgrqliofmfv.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rZXFteXV5d3NncnFsaW9mbWZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzM4OTIsImV4cCI6MjEwODcwOTg5Mn0.wFG1fJASe-ayWXn4ar5NzdC55JEnWEQSli44K0LhxZ4
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/photos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"